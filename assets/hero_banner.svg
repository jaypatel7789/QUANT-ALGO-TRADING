    <rect x="440" y="0" width="180" height="64" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="530" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="10" fill="#94a3b8" text-anchor="middle">BTC-011 VPIN TOXICITY</text>
