  <text x="452" y="47" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="600" fill="#38bdf8" letter-spacing="1.5">INSTITUTIONAL QUANTITATIVE SUITE</text>

