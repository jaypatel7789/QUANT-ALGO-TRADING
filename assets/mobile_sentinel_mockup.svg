      <text x="15" y="98" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#cbd5e1">$10,000.00</text>

      <text x="95" y="82" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b">Free Margin</text>
      <text x="95" y="98" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#cbd5e1">$9,814.80</text>

