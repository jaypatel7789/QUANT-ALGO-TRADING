      <text x="235" y="58" font-family="'JetBrains Mono', monospace" font-size="8" fill="#10b981">$0.00</text>
      <rect x="12" y="64" width="266" height="5" rx="2.5" fill="#0f172a"/>
      <rect x="12" y="64" width="6" height="5" rx="2.5" fill="#10b981"/>
