    <text x="10" y="114" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#00f2fe" text-anchor="middle">1</text>
    <text x="35" y="105" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Biometric &amp; PIN Defense</text>
    <text x="35" y="123" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">SHA-256 gated 4-digit PIN with hardware FaceID integration.</text>

    <!-- Point 2 -->
    <circle cx="10" cy="180" r="10" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="10" y="184" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#fbbf24" text-anchor="middle">2</text>
    <text x="35" y="175" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Shark Funded Risk Shield</text>
    <text x="35" y="193" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Real-time daily loss floor ($450) and max trailing drawdown ($800) meters.</text>

    <!-- Point 3 -->
    <circle cx="10" cy="250" r="10" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
    <text x="10" y="254" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#ef4444" text-anchor="middle">3</text>
    <text x="35" y="245" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">2-Second Hold Panic Liquidation</text>
    <text x="35" y="263" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Emergency kill switch that liquidates all positions across MT5 instantly.</text>

    <!-- Point 4 -->
    <circle cx="10" cy="320" r="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="10" y="324" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#10b981" text-anchor="middle">4</text>
    <text x="35" y="315" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">16 Algorithm Control Grid</text>
    <text x="35" y="333" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Granular switches for BTC, Gold, and EUR quantitative strategy engines.</text>

    <!-- Point 5 -->
    <circle cx="10" cy="390" r="10" fill="#0f172a" stroke="#a855f7" stroke-width="1.5"/>
    <text x="10" y="394" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#a855f7" text-anchor="middle">5</text>
    <text x="35" y="385" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">High-Impact News Shield</text>
    <text x="35" y="403" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Auto-freezes trading 30m before and 15m after major USD/EUR shocks.</text>

    <!-- Cloud VPS Live Status Box -->
    <rect x="0" y="440" width="460" height="75" rx="8" fill="#0f172a" stroke="#334155"/>
    <circle cx="25" cy="465" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="38" y="469" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#10b981">LIVE CLOUD VPS STATUS: VERIFIED 24/7</text>
    <text x="38" y="492" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#94a3b8">AWS EC2 i-082a917bee70b30d1 | XMGlobal-MT5 6 | Account #900909696350</text>
  </g>

  <!-- Right: Mobile Device Frame Preview -->
