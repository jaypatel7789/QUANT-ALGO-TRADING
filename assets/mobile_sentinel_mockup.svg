      <text x="35" y="24" font-family="'Outfit', sans-serif" font-size="9" font-weight="700" fill="#00f2fe" text-anchor="middle">Dashboard</text>
      <text x="95" y="24" font-family="'Outfit', sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Trades</text>
      <text x="155" y="24" font-family="'Outfit', sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Algos (16)</text>
      <text x="215" y="24" font-family="'Outfit', sans-serif" font-size="9" fill="#64748b" text-anchor="middle">News</text>
      <text x="265" y="24" font-family="'Outfit', sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Logs</text>
