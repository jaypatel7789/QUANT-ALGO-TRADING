      <text x="12" y="20" font-family="'Outfit', sans-serif" font-size="10" font-weight="700" fill="#f8fafc">ACTIVE TRADES ATTRIBUTION</text>
      
      <!-- Trade 1 -->
      <text x="12" y="42" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#fbbf24">BUY 0.05 GOLD.i#</text>
      <text x="12" y="55" font-family="'Inter', sans-serif" font-size="7.5" fill="#64748b">Magic 14024 • London ORB</text>
      <text x="230" y="45" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#10b981">+$84.50</text>

      <!-- Trade 2 -->
      <text x="12" y="70" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#38bdf8">BUY 0.02 BTCUSD#</text>
      <text x="230" y="72" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#10b981">+$46.75</text>
